name: hs_helper
description: Hearthstone advisor overlay — card recommendations for Constructed and Battlegrounds.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # SQLite ORM
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # HTTP client
  dio: ^5.8.0+1

  # Overlay window
  flutter_overlay_window: ^0.4.1

  # Desktop window control (size/position/always-on-top/transparency)
  window_manager: ^0.4.3

  # Windows file watching
  win32: ^5.10.0
  ffi: ^2.1.3

  # CSV parsing (HSReplay data)
  csv: ^6.0.0

  # Logging
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.4.4
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true
